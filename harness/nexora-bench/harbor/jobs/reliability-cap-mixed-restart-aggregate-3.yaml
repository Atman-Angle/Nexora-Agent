jobs_dir: jobs-output
n_attempts: 3
n_concurrent_trials: 3
environment:
  type: docker
agents:
  - import_path: nexora_harbor.agent:NexoraRuntimeAgent
    n_concurrent: 3
    kwargs:
      scenario_id: cap-mixed-restart-aggregate
      manifest_path: harness/nexora-bench/datasets/nexora-core-v1/pilot-batch-a.json
      provider_mode: deterministic
verifier:
  import_path: nexora_harbor.verifier:NexoraRuntimeVerifier
datasets:
  - path: datasets/nexora-capability-v1
    task_names:
      - cap-mixed-restart-aggregate
