jobs_dir: jobs-output
n_attempts: 5
n_concurrent_trials: 3
environment:
  type: docker
agents:
  - import_path: nexora_harbor.agent:NexoraRuntimeAgent
    n_concurrent: 3
    kwargs:
      scenario_id: cap-batch-manifest-reorganize
      manifest_path: harness/nexora-bench/datasets/nexora-core-v1/cohort-d-batch-automation.json
      provider_mode: deterministic
verifier:
  import_path: nexora_harbor.verifier:NexoraRuntimeVerifier
datasets:
  - path: datasets/nexora-capability-v1
    task_names:
      - cap-batch-manifest-reorganize
